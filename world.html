<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101612">
  <meta name="description" content="Explore the shared PaperTrade world, mine virtual money blocks, and chat with other players.">
  <title>PaperTrade — Shared Money World</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101612; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; color: #eef4ef; background: #101612; font: 15px/1.5 system-ui, sans-serif; text-align: center; }
  </style>
</head>
<body>
  <iframe title="PaperTrade shared money world" src="./index.html?view=world"></iframe>
  <script>
    function getWorldConsoleApi(name) {
      const frame = document.querySelector("iframe");
      const api = frame?.contentWindow?.[name];
      if (typeof api !== "function") {
        throw new Error("World is still loading. Wait for it to finish, then try again.");
      }
      return api;
    }

    window.papertradeWorldBlocks = (...args) => getWorldConsoleApi("papertradeWorldBlocks")(...args);
    window.papertradeSkipMiningTimer = (...args) => getWorldConsoleApi("papertradeSkipMiningTimer")(...args);
  </script>
  <noscript><div class="fallback">Enable JavaScript to enter the shared world.</div></noscript>
</body>
</html>
